[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dj-library"
version = "0.1.0"
description = "Agent-oriented Spotify, local-library, and Rekordbox workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mutagen>=1.47.0",
  "python-dotenv>=1.0.0",
  "rapidfuzz>=3.0.0",
  "requests>=2.31.0",
  "spotipy>=2.24.0",
]

[project.optional-dependencies]
audio = ["essentia==2.1b6.dev1389"]
rekordbox = ["pyrekordbox==0.4.4"]
dev = [
  "pytest>=9.0.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
pythonpath = ["src"]
addopts = "-m 'not e2e'"
markers = [
  "integration: offline multi-component workflow test",
  "e2e: opt-in test requiring a real external service",
]

[tool.coverage.run]
source = ["dj_library"]
omit = ["scripts/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
